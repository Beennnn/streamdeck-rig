<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Emplacement">
			<sdpi-range setting="slot" min="1" max="12" default="1" step="1" showlabels></sdpi-range>
		</sdpi-item>
		<sdpi-item>
			<sdpi-message>
				Emplacement 1 = le problème le plus grave. Chaque touche affiche le problème à sa
				position et lance son correctif au clic. Pose-en plusieurs (1, 2, 3…) pour un tableau
				de bord vivant.
			</sdpi-message>
		</sdpi-item>
	</body>
</html>
